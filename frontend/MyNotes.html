<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - UpdatesHub</title>
    <link rel="stylesheet" href="styles1.css">
</head>
<body>
    <!-- Search Bar -->
    <input type="text" id="searchInput" placeholder="🔍 Search..." onkeyup="searchNotes()">

    <!-- Page Title -->
    <h2>My Notes</h2>

    <!-- Notes List -->
    <ul id="notesList"></ul>

    <!-- Review Modal (for rating recall quality) -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <h2>Review Note</h2>
            <p>How well did you remember the note?</p>
            <button onclick="rateQuality(5)">Excellent (5)</button>
            <button onclick="rateQuality(4)">Good (4)</button>
            <button onclick="rateQuality(3)">Okay (3)</button>
            <button onclick="rateQuality(2)">Poor (2)</button>
            <button onclick="rateQuality(1)">Very Poor (1)</button>
        </div>
    </div>

    <!-- Logout Button -->
    <button id="logoutBtn" class="btn">Logout</button>

    <script src="MyNotes.js"></script>
</body>
</html>
