<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpdatesHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <hr class="divider">    
    <h1 class="title">UpdatesHub</h1>
    <hr class="divider">

    <div class="button-container">
        <!-- Button to open the modal for creating a new note -->
        <button class="create-note-btn" onclick="openCreateNoteModal()">Create New Note</button>
        <button id="logoutBtn" class="logout">🚪 Logout</button>  <!-- 🔄 Fixed Logout Button -->
    </div>

    <hr class="divider">

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Saved Notes</h2>
            <ul>
                <li><a href="dashboard.html">📌 Dashboard</a></li>
                <li><a href="MyNotes.html">📂 My Notes</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="content">
            <h2>Welcome to UpdatesHub</h2>
            <p>Start creating and managing your notes efficiently!</p>
        </div>
    </div>

    <!-- Modal for Creating New Note -->
    <div id="createNoteModal" class="modal">
        <div class="modal-content">
            <h3>Create a New Note</h3>
            <input type="text" id="noteTitle" placeholder="Title" required />
            <textarea id="noteContent" placeholder="Write your note..." required></textarea>
            <button class="btn" onclick="createNote()">Create Note</button>
            <button class="btn" onclick="closeCreateNoteModal()">Cancel</button>
        </div>
    </div>

    <!-- ✅ Include JavaScript File -->
    <script src="auth.js"></script>
    <script src="index.js"></script>

</body>
</html>
